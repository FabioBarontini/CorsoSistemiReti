<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il mio Atlante — Accesso</title><link rel="stylesheet" href="assets/study.css"><style>body{margin:0;background:#050608;color:#e9e3d6;font-family:Inter,Arial,sans-serif}</style></head><body>
<div class="auth-shell"><div class="auth-box"><div style="font:10px 'DM Mono';letter-spacing:.2em;color:#c7a96b">ATLANTE DELLA RETE</div><h1>Il mio Atlante</h1><p>Accedi per conservare sottolineature, segnalibri e note personali su tutti i dispositivi.</p><label>NOME — solo per una nuova registrazione</label><input id="name" autocomplete="name"><label>E-MAIL</label><input id="email" type="email" autocomplete="email"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"><button id="submit">ACCEDI</button><div class="auth-switch"><button id="signup">CREA ACCOUNT</button><button id="forgot">PASSWORD DIMENTICATA</button></div><div class="auth-msg" id="msg"></div><p style="font-size:11px;margin-top:25px"><a href="index.html" style="color:#9fcbb1">← Torna all'Atlante</a></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script>
<script>
const cfg=window.ATLANTE_SUPABASE||{};const ok=cfg.url&&!cfg.url.includes('TUO-PROGETTO')&&cfg.anonKey&&!cfg.anonKey.includes('LA-TUA');let sb=ok?supabase.createClient(cfg.url,cfg.anonKey):null;const msg=t=>document.getElementById('msg').textContent=t;
if(!sb)msg('Configura prima assets/supabase-config.js con URL e anon key del progetto Supabase.');
const next=new URLSearchParams(location.search).get('next');
document.getElementById('submit').onclick=async()=>{if(!sb)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)msg(error.message);else location.href=next||'studio.html';};
document.getElementById('signup').onclick=async()=>{if(!sb)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('name').value.trim();const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)msg(error.message);else msg(data.session?'Account creato.':'Controlla la posta per confermare l\'account.');};
document.getElementById('forgot').onclick=async()=>{if(!sb)return;const email=document.getElementById('email').value.trim();if(!email)return msg('Inserisci prima la tua e-mail.');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});msg(error?error.message:'Controlla la posta per reimpostare la password.');};
</script></body></html>
