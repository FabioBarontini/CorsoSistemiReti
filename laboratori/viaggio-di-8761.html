<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: un librogame su una colonna di lettura; a destra (sotto, su telefono) lo "zaino" con orologio, TTL, percorso, concetti, trofei e finali. Colori per personaggio: pacchetto = ambra del segnale, server e scuola = verde, mittente = blu, router = arancio, DNS e UDP = magenta */
:root{
  --bg:#F2F4F8; --paper:#FFFFFF; --sunk:#E5E9F1; --line:#C8D0DE;
  --ink:#151C2E; --muted:#56607A;
  --amber:#C77A00; --amber-soft:#FCEFD6;
  --green:#1E8455; --green-soft:#DDF1E6;
  --blue:#2457C5; --blue-soft:#DFE8FB;
  --magenta:#A3337A; --magenta-soft:#F6E0EE;
  --orange:#C2531B; --orange-soft:#FBE6DA;
  --red:#BF3A30; --red-soft:#F8E1DE;
  --role:var(--amber); --role-soft:var(--amber-soft);
  --display:"Martian Mono", "IBM Plex Mono", Consolas, monospace;
  --body:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --paper:#151C2F; --sunk:#1C2540; --line:#2C3756;
  --ink:#E7EBF5; --muted:#9CA6C2;
  --amber:#F2A93B; --amber-soft:#3A2C12;
  --green:#4CC78C; --green-soft:#153126;
  --blue:#7EA4F7; --blue-soft:#1A2850;
  --magenta:#E77DBE; --magenta-soft:#3A1830;
  --orange:#F28A55; --orange-soft:#3A2015;
  --red:#F07B70; --red-soft:#3D1B18; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --paper:#151C2F; --sunk:#1C2540; --line:#2C3756;
  --ink:#E7EBF5; --muted:#9CA6C2;
  --amber:#F2A93B; --amber-soft:#3A2C12;
  --green:#4CC78C; --green-soft:#153126;
  --blue:#7EA4F7; --blue-soft:#1A2850;
  --magenta:#E77DBE; --magenta-soft:#3A1830;
  --orange:#F28A55; --orange-soft:#3A2015;
  --red:#F07B70; --red-soft:#3D1B18; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6}
body.r-dest,body.r-marco{--role:var(--green);--role-soft:var(--green-soft)}
body.r-mitt{--role:var(--blue);--role-soft:var(--blue-soft)}
body.r-udp,body.r-dns{--role:var(--magenta);--role-soft:var(--magenta-soft)}
body.r-router{--role:var(--orange);--role-soft:var(--orange-soft)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{border-bottom:1px solid var(--line);background:var(--paper)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.logo{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.logo b{color:var(--role)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 .82rem var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--role)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--role);outline-offset:2px}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:32px;padding-block:28px 64px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chip{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--role-soft);color:var(--role);border:1px solid var(--role)}
.chip.plain{background:transparent;color:var(--muted);border-color:var(--line)}
.chip.kind{background:var(--paper);color:var(--ink);border-color:var(--line)}
h1.node{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,3.2vw,2rem);line-height:1.2;margin:0 0 18px;text-wrap:balance}
.story{max-width:66ch}
.story p{margin:0 0 1em}
.story .say{border-left:3px solid var(--role);padding-left:14px;font-style:italic;color:var(--muted)}
.story .d{padding-left:14px;border-left:3px solid var(--line)}
.story .d b{font-family:var(--mono);font-size:.78em;letter-spacing:.05em;text-transform:uppercase;color:var(--role);margin-right:4px}
.story .log{font:400 .84rem/1.5 var(--mono);background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre;overflow-x:auto}
.widget,.puzzle{margin:22px 0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
.puzzle{border:2px solid var(--role)}
.widget .cap,.puzzle .cap{font:600 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.puzzle .q{font-size:1.02rem;margin:0 0 10px;display:block}
.puzzle input[type=text]{font:600 1rem var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:10em}
.puzzle input[type=range]{width:min(100%,420px)}
.puzzle .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.puzzle .fb{font:600 .9rem var(--mono);min-height:1.4em;margin:8px 0 0}
.puzzle .fb.ok{color:var(--green)} .puzzle .fb.no{color:var(--red)}
.tok{font:600 .85rem var(--mono);padding:8px 10px;border-radius:6px;border:2px solid var(--line);background:var(--sunk);cursor:pointer;color:var(--ink)}
.tok.used{opacity:.35;cursor:default}
.seqout{display:flex;gap:6px;flex-wrap:wrap;min-height:44px;margin-top:10px;padding:6px;border:1px dashed var(--line);border-radius:6px;font:400 .8rem var(--mono);color:var(--muted)}
.chan{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chan .lamp{font:800 .9rem var(--display);padding:10px 14px;border-radius:8px;min-width:11em;text-align:center}
.chan .lamp.busy{background:var(--red-soft);color:var(--red);border:2px solid var(--red)}
.chan .lamp.free{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}
.learn{margin:22px 0;border:1px dashed var(--role);border-radius:10px;padding:12px 14px;background:var(--role-soft);max-width:66ch}
.learn .h{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--role)}
.learn dl{margin:6px 0 0}
.learn dt{font-family:var(--display);font-weight:600;font-size:.92rem;margin-top:8px}
.learn dd{margin:2px 0 0;font-size:1rem}
.choices{display:grid;gap:10px;margin-top:26px;max-width:66ch}
.choice{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;font:400 1.02rem/1.45 var(--body);padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
.choice:hover{border-color:var(--role);background:var(--role-soft)}
.choice .k{font:800 .9rem var(--display);color:var(--role);padding-top:2px}
.locked{font:600 .82rem var(--mono);color:var(--muted);margin-top:18px}
.ending{margin:24px 0;padding:16px;border-radius:10px;border:2px solid var(--red);background:var(--red-soft);max-width:66ch}
.ending.good{border-color:var(--green);background:var(--green-soft)}
.ending .h{font:800 .8rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.ending.good .h{color:var(--green)}
.ending .t{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:4px 0 0}
.ending .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font:600 .74rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
aside{position:sticky;top:16px;display:grid;gap:14px;min-width:0}
@media (max-width:920px){aside{position:static}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font:800 .74rem var(--display);letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font:400 .85rem var(--mono)}
.kv span:nth-child(odd){color:var(--muted)}
.clock{font:800 1.5rem var(--display);font-variant-numeric:tabular-nums}
.ttlbar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;margin-top:8px}
.ttlbar i{display:block;height:100%;background:var(--amber)}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.clist li{font:400 .74rem var(--mono);padding:3px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.clist li.on{background:var(--role-soft);color:var(--ink);border:1px solid var(--role)}
.trail{font:400 .74rem/1.7 var(--mono);color:var(--muted);max-height:130px;overflow:auto}
.trail b{color:var(--ink)}
.prog{font:600 .85rem var(--mono);margin:0 0 8px}
.parts{display:grid;gap:6px}
.parts button{text-align:left}
.parts button:disabled{opacity:.42;cursor:not-allowed;border-style:dashed;color:var(--muted,#8a929d);background:rgba(255,255,255,.025)}
.parts button:disabled::after{content:" · non ancora raggiunta";font-size:.78em;opacity:.9}
.parts button:not(:disabled){cursor:pointer}
details.panel summary{cursor:pointer;font:800 .74rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* widgets */
.hdr{font:400 .82rem var(--mono);min-width:520px}
.hdr .layer{border:2px solid;border-radius:8px;padding:8px 10px;margin-top:6px}
.hdr .layer>b{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;color:var(--paper);margin-bottom:6px}
.hdr .L2{border-color:var(--muted)} .hdr .L2>b{background:var(--muted)}
.hdr .L3{border-color:var(--blue)} .hdr .L3>b{background:var(--blue)}
.hdr .L4{border-color:var(--green)} .hdr .L4>b{background:var(--green)}
.hdr .L7{border-color:var(--amber);background:var(--amber-soft)}
.hdr .f{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px}
.hdr .f span i{font-style:normal;color:var(--muted)}
.hdr mark{background:var(--amber);color:#1b1300;padding:0 3px;border-radius:3px}
.seq{display:flex;gap:6px;flex-wrap:wrap;font:600 .78rem var(--mono)}
.seq .s{min-width:62px;padding:8px 6px;border-radius:6px;border:2px solid var(--line);text-align:center;background:var(--paper)}
.seq .s small{display:block;font-weight:400;font-size:.66rem;color:var(--muted)}
.seq .ok{background:var(--green-soft);border-color:var(--green)}
.seq .buf{background:var(--blue-soft);border-color:var(--blue)}
.seq .miss{border-style:dashed;border-color:var(--red);color:var(--red);background:var(--red-soft)}
.seq .fly{background:var(--amber-soft);border-color:var(--amber)}
.seq .you{box-shadow:0 0 0 3px var(--amber)}
.seq .wait{opacity:.55}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:400 .72rem var(--mono);color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:2px solid}
.calc{font:400 .9rem/1.6 var(--mono);white-space:pre-wrap;margin:0}
.route{display:flex;align-items:center;flex-wrap:wrap;font:600 .74rem var(--mono)}
.route .st{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;text-align:center}
.route .dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue);background:var(--paper)}
.route .st.done .dot{background:var(--blue)}
.route .st.here .dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft)}
.route .ln{flex:1;min-width:16px;height:3px;background:var(--blue);margin-top:-22px}
.queue{display:flex;gap:4px;align-items:center;font:600 .74rem var(--mono)}
.queue .q{width:34px;height:40px;border-radius:5px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--sunk)}
.queue .q.f{background:var(--blue-soft);border-color:var(--blue)}
.queue .q.y{background:var(--amber);border-color:var(--amber);color:#1b1300}
svg text{font-family:var(--mono)}
@media (prefers-reduced-motion: no-preference){.story,.widget,.choices,.puzzle{animation:in .35s ease-out both}@keyframes in{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<script>
(function(){
"use strict";
/* ===================== CONCETTI ===================== */

 calc(t,cap){return `<div class="cap">${cap||"Facciamo i conti"}</div><pre class="calc">${t}</pre>`;},

 bars(vals,o={}){const mx=Math.max(...vals,o.max||0);const w=Math.max(340,vals.length*34+60);const h=180;const bw=(w-60)/vals.length;
  let s=`<div class="cap">${o.cap||"Finestra di congestione a ogni RTT"}</div><svg viewBox="0 0 ${w} ${h+44}" width="100%" style="max-width:${w}px;min-width:340px" role="img" aria-label="${o.cap||"grafico"}">`;
  [0,.5,1].forEach(f=>{const y=10+h*(1-f);s+=`<line x1="40" y1="${y}" x2="${w-10}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="34" y="${y+4}" text-anchor="end" fill="var(--muted)" font-size="11">${Math.round(mx*f)}</text>`;});
  vals.forEach((v,i)=>{const bh=h*v/mx;const x=44+i*bw;const col=(o.loss||[]).includes(i)?"var(--red)":"var(--blue)";s+=`<rect x="${x}" y="${10+h-bh}" width="${bw-6}" height="${bh}" rx="3" fill="${col}"/><text x="${x+(bw-6)/2}" y="${h+26}" text-anchor="middle" fill="var(--muted)" font-size="11">${i+1}</text><text x="${x+(bw-6)/2}" y="${6+h-bh}" text-anchor="middle" fill="var(--ink)" font-size="11">${v}</text>`;});
  if(o.thr){const y=10+h*(1-o.thr/mx);s+=`<line x1="40" y1="${y}" x2="${w-10}" y2="${y}" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 5"/><text x="${w-12}" y="${y-5}" text-anchor="end" fill="var(--amber)" font-size="11">${o.thrLab||"soglia"}</text>`;}
  return s+`<text x="${w/2}" y="${h+40}" text-anchor="middle" fill="var(--muted)" font-size="11">RTT</text></svg>`;}

/* ---------- PROLOGO ---------- */
p0:{part:"Prologo",role:"pkt",title:"Lisbona, ore 17:42",pos:"telefono di Giulia",
body:`<p>Il sole basso sul Tago colora tutto d'arancione. La 3ªA è in gita a Lisbona e Giulia ha appena scattato la foto che tutti aspettavano: ventidue ragazzi e due professori stretti davanti al Padrão dos Descobrimentos, nessuno con gli occhi chiusi. Un miracolo statistico.</p>
<p>Il telefono vibra. È Marco, rimasto in Italia con il gesso al piede, che cura il sito della scuola:</p>
${D("Marco","«Mandatemi LA foto. Alle 18 la metto in home. Se arriva quella con Edo che sbadiglia, giuro che pubblico quella.»")}
<p>Giulia apre l'app del sito, sceglie la foto, preme <em>Invia</em>. Tre megabyte. Destinazione: il server della scuola, a duemila chilometri di distanza.</p>
<p>E in quel momento nasci tu. Non sei la foto: sei un pezzo della foto. Una striscia sottile di cielo, un angolo del cappello di Luca, metà del sorriso della prof di inglese. Sei un <strong>segmento</strong>, e stai per fare il viaggio più veloce e più complicato della tua vita.</p>
<p class="say">Come si gioca. A ogni bivio scegli tu. Alcune scelte portano lontano, altre a un finale che non ti piacerà: niente paura, potrai sempre tornare al bivio. A volte dovrai risolvere un enigma per andare avanti. Nel pannello c'è l'orologio del tuo viaggio: ogni ritardo si somma. E durante la storia cambierai ruolo: sarai una domanda, un pacchetto, un router, il computer che riceve, quello che spedisce.</p>`,
ch:[["Comincia. Ma un momento: dove si trova, esattamente, il server della scuola?","d0"]]},

/* ---------- CAPITOLO 0: DNS ---------- */
d0:{part:"0 · Come si chiama il server?",role:"dns",title:"Una domanda di 40 byte",pos:"telefono di Giulia",
body:`<p>Il pulsante <em>Invia</em> è appena scomparso sotto il pollice di Giulia. La foto non si è ancora mossa: prima il telefono deve trovare la strada giusta per raggiungere la scuola.</p>
<p>Prima di te, prima ancora della foto, il telefono ha un problema: l'app conosce il nome del sito, <strong>www.istituto-esempio.it</strong>, ma i router non sanno che farsene dei nomi. Lavorano solo con gli indirizzi IP.</p>
<p>Per il momento sei un'altra cosa: una minuscola <strong>domanda DNS</strong>, quaranta byte in tutto, che chiede «qual è l'indirizzo IP di www.istituto-esempio.it?». Viaggi con UDP verso la porta 53: niente strette di mano, niente conferme. Si chiede e si spera.</p>
<p>A chi vai a chiedere?</p>`,
learn:["dns","port"],
ch:[["Al server DNS indicato dalla rete dell'hotel: il resolver","d1"],["Direttamente a uno dei server radice di Internet: chi meglio di loro?","d0b"],["A nessuno: il telefono può tirare a indovinare un indirizzo plausibile","d0a"]]},
d0a:{part:"0 · Come si chiama il server?",role:"dns",title:"L'indirizzo inventato",pos:"telefono di Giulia",
body:`<p>Il telefono sceglie 93.62.140.21. Sbaglia di uno. La foto parte verso il computer di un ufficio di Bergamo, che non ha nessun server web e non risponde. Dopo qualche secondo l'app mostra «Impossibile connettersi al server».</p>
${D("Marco","«Giulia? Allora? Sono le 17:59.»")}
<p>Gli indirizzi IP non si indovinano: ognuno identifica un solo dispositivo nella rete. Serve qualcuno che conosca davvero la risposta.</p>`,
end:"guess",back:"d0"},
d0b:{part:"0 · Come si chiama il server?",role:"dns",title:"Il centralino di Internet",pos:"verso un server radice",err:true,
body:`<p>Ti ritrovi davanti a una fila di server che sembrano porte illuminate in una città notturna. La tentazione è bussare alla più grande, ma persino il centralino più importante non conosce ogni indirizzo: sa chi può saperlo.</p>
<p>I server radice esistono davvero: sono tredici «nomi», da a.root-servers.net a m.root-servers.net, distribuiti in centinaia di copie in tutto il mondo. Ma non sanno l'indirizzo della tua scuola. Sanno soltanto a chi chiedere per i domini <strong>.it</strong>.</p>
<p>E poi, se ogni telefono del pianeta chiedesse direttamente a loro, verrebbero sommersi. Per questo i telefoni chiedono a un intermediario, il <strong>resolver</strong>, che fa il giro delle domande e si ricorda le risposte.</p>`,
ch:[["Torna alla scelta","d0"]]},
d1:{part:"0 · Come si chiama il server?",role:"dns",title:"Il giro delle domande",pos:"resolver DNS",
body:`<p>Il resolver dell'operatore portoghese ti legge e consulta la sua memoria, la <strong>cache</strong>. Niente. Per un momento sembra quasi infastidito: il nome della scuola non gli dice dove si trovi il server, e il telefono di Giulia non può aspettare che qualcuno, da qualche parte, si ricordi la risposta.</p>
<p>Il resolver apre allora una serie di richieste. Ogni risposta gli permetterà di restringere il campo, ma nessun server possiede da solo tutta la mappa. Sullo schermo di Giulia, intanto, la barra di caricamento è ancora ferma.</p>`,
puzzle:{type:"order",id:"tdns",q:"In che ordine il resolver interroga i server? Clicca le tappe nell'ordine giusto.",
 items:[["server di istituto-esempio.it","c"],["server radice","a"],["server del dominio .it","b"]],correct:["a","b","c"],
 hint:"si parte dalla cima della gerarchia, quella che sa chi gestisce .it.",ok:"Esatto: radice, poi .it, poi il server della scuola. La risposta è 93.62.140.20."},
body2:`<p>La risposta torna con un'etichetta: <em>valida per 3600 secondi</em>. È il <strong>TTL del DNS</strong>, che con il TTL dei pacchetti condivide solo il nome: dice per quanto tempo il resolver può tenere la risposta in cache. Il prossimo compagno che caricherà una foto avrà la risposta in un istante.</p>
<p>Ora il telefono sa dove spedire. Tocca alla foto.</p>`,
learn:["resolver","dnsttl"],prob:["Il telefono conosce il nome del server, ma non il suo indirizzo IP","Una domanda al DNS, che risponde partendo dai server radice"],
ch:[["Torna alla foto","p1"]]},

/* ---------- PARTE I ---------- */
p1:{part:"I · Nato da una foto",role:"pkt",title:"Troppo grande per viaggiare",pos:"telefono di Giulia",
body:`<p>La foto si apre sullo schermo e, per un istante, ti sembra enorme: il cielo, i volti, il monumento. Poi una mano invisibile comincia a dividerla in fette regolari. Il viaggio non può partire finché ogni fetta non è abbastanza piccola da passare.</p>
<p>Tre megabyte sono tre milioni di byte. Nessuna rete li farebbe viaggiare tutti insieme: un solo errore a metà strada costringerebbe a rispedire tutto, e nel frattempo quel blocco enorme occuperebbe i collegamenti impedendo agli altri di usarli. Bisogna adattare i dati alla rete, non aspettare una rete migliore.</p>
<p>Così, dentro il telefono di Giulia, un programma silenzioso chiamato <strong>TCP</strong> prende la foto e la affetta. Ogni fetta deve stare in un pacchetto, e sul Wi-Fi dell'hotel un pacchetto non può superare 1500 byte: è la <strong>MTU</strong> del collegamento. Venti byte vanno all'intestazione IP, venti a quella TCP. Restano <strong>1460 byte</strong> di dati: è la <strong>MSS</strong>.</p>`,
w:()=>W.calc(`foto                 3 000 000 byte
dati per segmento        1 460 byte (MSS)
─────────────────────────────────────
segmenti necessari   3 000 000 / 1 460 ≈ 2 055`,"Quante fette?"),
