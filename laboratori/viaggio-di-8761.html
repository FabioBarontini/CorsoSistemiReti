const KEY="viaggio8761v2";
const ROLE={pkt:["Sei il pacchetto 8761","r-pkt"],dns:["Sei una domanda DNS","r-dns"],dest:["Sei il TCP del server","r-dest"],mitt:["Sei il TCP del telefono","r-mitt"],udp:["Sei un pacchetto UDP","r-udp"],router:["Sei il router di Madrid","r-router"],marco:["Intanto, a scuola","r-marco"]};
let S={node:"p0",trail:[],c:[],e:[],t:[],log:[],solved:{}};
try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&N[v.node])S=Object.assign(S,v);}catch(e){}
if(!Array.isArray(S.visited))S.visited=[];
[...(Array.isArray(S.trail)?S.trail:[]),S.node].forEach(id=>{if(N[id]&&!S.visited.includes(id))S.visited.push(id);});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=s=>document.querySelector(s);
let timer=null;
const PROB={};Object.entries(N).forEach(([k,n])=>{if(n.prob)PROB[k]=n.prob;});
function logTable(){if(!S.log.length)return `<div class="cap">Registro di bordo</div><p>Nessun problema registrato in questa partita.</p>`;
 return `<div class="cap">Il tuo registro di bordo · i problemi che hai incontrato e come li hai risolti</div><div style="overflow-x:auto"><table class="t"><tr><th>Problema incontrato</th><th>Soluzione</th></tr>${S.log.filter(k=>PROB[k]).map(k=>`<tr><td>${PROB[k][0]}</td><td>${PROB[k][1]}</td></tr>`).join("")}</table></div>`;}
function clockMs(){let ms=0;[...S.trail,S.node].forEach(k=>{const n=N[k];if(n&&n.ms)ms+=n.ms;});return ms;}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function go(id,push=true){if(!N[id])return;stop();if(id==="p0"){S.trail=[];S.log=[];S.visited=[];}else if(push&&S.node!==id)S.trail.push(S.node);S.node=id;render();save();window.scrollTo({top:0,behavior:"auto"});}
function kindChip(n){if(n.end)return n.good?"Finale principale":"✗ Finale";if(n.err)return "✗ Non proprio";if(n.puzzle&&n.puzzle.type!=="csma"&&!S.solved[n.puzzle.id])return "Enigma";if(n.puzzle&&n.puzzle.type==="csma")return "Minigioco";if(n.ch&&n.ch.length>1)return "❓ Bivio";return "✓ Avanti";}
function trophy(id){const tid=id.replace(/2$/,"");if(TR[tid]&&!S.t.includes(tid))S.t.push(tid);}
function render(){
 if(!Array.isArray(S.visited))S.visited=[];
 if(!S.visited.includes(S.node))S.visited.push(S.node);
 const n=N[S.node];const r=ROLE[n.role]||ROLE.pkt;
 document.body.className=r[1];
 const sceneText=(n.part+" "+n.title+" "+n.pos).toLowerCase();
 let scene="origin";
 if(n.role==="dns" || /dns|resolver|server radice|dominio|cache/.test(sceneText)) scene="dns";
 else if(/rete locale|lan|wi-fi|wifi|access point|switch|arp|mac del gateway/.test(sceneText)) scene="lan";
 else if(/router|internet|wan|madrid|milano|sotto il mare|ixp|instrad/.test(sceneText) || n.role==="router") scene="wan";
 document.body.dataset.scene=scene;
 (n.learn||[]).forEach(k=>{if(!S.c.includes(k))S.c.push(k);});
 if(n.end&&!S.e.includes(n.end))S.e.push(n.end);
 if(n.prob&&!S.log.includes(S.node))S.log.push(S.node);
 const pz=n.puzzle;const open=!pz||pz.type==="csma"||S.solved[pz.id];
 let h=`<div class="meta"><span class="chip">${r[0]}</span><span class="chip plain">${n.part}</span><span class="chip kind">${kindChip(n)}</span></div><h1 class="node">${n.title}</h1><div class="story">${n.body}</div>`;
 if(n.w)h+=`<div class="widget">${n.w()}</div>`;
 if(pz)h+=`<div class="puzzle" id="pz"></div>`;
 if(n.body2&&open)h+=`<div class="story">${n.body2}</div>`;
 if(n.learn&&n.learn.length&&open)h+=`<div class="learn"><div class="h">Concetti in questa pagina</div><dl>${n.learn.map(k=>`<dt>${C[k][0]}</dt><dd>${C[k][1]}</dd>`).join("")}</dl></div>`;
 if(n.end)h+=`<div class="ending ${n.good?"good":""}"><div class="h">${n.good?"Finale principale":"Finale"} · ${S.e.length} di ${Object.keys(EN).length} scoperti</div><div class="t">${EN[n.end]}</div>${n.back?`<div class="row"><button type="button" data-go="${n.back}">↩ Torna al bivio</button><button type="button" data-go="p0">Ricomincia dall'inizio</button></div>`:""}</div>`;
 if(n.ch){if(!open)h+=`<p class="locked">Risolvi l'enigma per andare avanti.</p>`;else h+=`<div class="choices">${n.ch.map((c,i)=>`<button class="choice" type="button" data-go="${c[1]}"><span class="k">${String.fromCharCode(65+i)}</span><span>${c[0]}</span></button>`).join("")}</div>`;}
 $("#main").innerHTML=h;
 
 if(pz)renderPuzzle(pz);
 side(n,r);
 renderParts();
}
function solve(pz){S.solved[pz.id]=true;trophy(pz.id);save();render();}
function renderPuzzle(pz){
 const el=$("#pz");const solved=!!S.solved[pz.id];
 if(pz.type==="number"){
  el.innerHTML=`<div class="cap">Enigma</div><p class="q">${pz.q}</p>${solved?`<p class="fb ok">✓ ${pz.ok}</p>`:`<div class="row"><input type="text" id="pz-in" inputmode="numeric" autocomplete="off" aria-label="Risposta"><button type="button" id="pz-go">Verifica</button><button type="button" id="pz-hint">Indizio</button></div><p class="fb" id="pz-fb" aria-live="polite"></p>`}`;
  if(solved)return;const inp=$("#pz-in"),fb=$("#pz-fb");
  const check=()=>{const v=parseInt(inp.value.replace(/[\s.']/g,""),10);if(pz.a.includes(v))solve(pz);else{fb.className="fb no";fb.textContent="✗ Non è questo. Riprova, o chiedi un indizio.";}};
  $("#pz-go").onclick=check;inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});$("#pz-hint").onclick=()=>{fb.className="fb";fb.textContent="Indizio: "+pz.hint;};
 }
 if(pz.type==="order"){
  if(solved){el.innerHTML=`<div class="cap">Enigma</div><p class="q">${pz.q}</p><p class="fb ok">✓ ${pz.ok}</p>`;return;}
  let picked=[];
  const draw=(msg,cls)=>{el.innerHTML=`<div class="cap">Enigma</div><p class="q">${pz.q}</p><div class="row">${pz.items.map(([l,k])=>`<button type="button" class="tok ${picked.includes(k)?"used":""}" data-k="${k}" ${picked.includes(k)?"disabled":""}>${l}</button>`).join("")}</div><div class="seqout">${picked.length?picked.map(k=>`<span class="tok">${pz.items.find(x=>x[1]===k)[0]}</span>`).join(""):"la tua sequenza"}</div><p class="fb ${cls||""}" aria-live="polite">${msg||""}</p>`;
   el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k===pz.correct[picked.length]){picked.push(k);if(picked.length===pz.correct.length){solve(pz);return;}draw();}else{picked=[];draw("✗ Non è il prossimo: si ricomincia. Indizio: "+pz.hint,"no");}});};

 }
 if(pz.type==="csma"){
  let busy=true;
  el.innerHTML=`<div class="cap">Minigioco · ascolta prima di parlare</div><p class="q">Premi «Trasmetti» quando il canale è libero.</p><div class="chan"><span class="lamp busy" id="lamp">CANALE OCCUPATO</span><button type="button" id="tx">Trasmetti</button></div>`;
  const flip=()=>{busy=Math.random()<(busy?0.5:0.55);const l=$("#lamp");if(l){l.className="lamp "+(busy?"busy":"free");l.textContent=busy?"CANALE OCCUPATO":"CANALE LIBERO";}};
  timer=setInterval(flip,700);
  $("#tx").onclick=()=>{stop();if(busy)go(pz.fail);else{S.solved[pz.id]=true;trophy(pz.id);go(pz.win);}};
 }
 if(pz.type==="slider"){
  const RTT=50,SEG=2055,RW=44;
  el.innerHTML=`<div class="cap">Laboratorio · finestra e velocità</div><label for="wsl" class="q">Segmenti in volo (finestra): <b id="wv">1</b></label><input type="range" id="wsl" min="1" max="80" value="${solved?RW:1}"><pre class="calc" id="wcalc" style="margin-top:10px"></pre><p class="fb" id="wfb" aria-live="polite"></p>`;
  const sl=$("#wsl");
  const upd=()=>{const w=+sl.value;$("#wv").textContent=w;const eff=Math.min(w,RW);const rtts=Math.ceil(SEG/eff);const t=rtts*RTT/1000;
   $("#wcalc").textContent=`finestra effettiva = min(${w}, ${RW}) = ${eff} segmenti\nRTT necessari     = 2055 / ${eff} ≈ ${rtts}\ntempo             ≈ ${rtts} × 50 ms = ${t.toFixed(1).replace(".",",")} s\nvelocità          ≈ ${Math.round(eff*1460/0.05/1000)} KB/s`;
   const fb=$("#wfb");
   if(w>RW){fb.className="fb no";fb.textContent="Oltre 44 non vai più veloce: il server non accetta di più, e il resto verrebbe scartato.";}
   else if(w===RW){fb.className="fb ok";fb.textContent="✓ La finestra giusta: 44 segmenti, circa 2,4 secondi invece di 1 minuto e 43.";if(!S.solved[pz.id]){S.solved[pz.id]=true;trophy(pz.id);save();render();}}
   else{fb.className="fb";fb.textContent="Prova ad aumentare la finestra.";}};
  sl.addEventListener("input",upd);upd();
 }
}
function side(n,r){
 const ttl=n.ttl!=null?n.ttl:null;const ms=clockMs();
 $("#p-state").innerHTML=`<h2>Stato</h2><div class="kv"><span>ruolo</span><span>${r[0].replace(/^Sei /,"")}</span><span>dove</span><span>${n.pos||"—"}</span>${ttl!=null?`<span>TTL</span><span>${ttl} / 64</span>`:""}</div>${ttl!=null?`<div class="ttlbar" aria-hidden="true"><i style="width:${ttl/64*100}%"></i></div>`:""}<p class="prog" style="margin:12px 0 0">Orologio del viaggio di 8761</p><div class="clock">${ms} ms</div>`;
 const tr=[...S.trail,S.node];$("#trail").innerHTML=tr.map((k,i)=>i===tr.length-1?`<b>${N[k].title}</b>`:N[k].title).join(" → ");
 const ck=Object.keys(C);$("#c-prog").textContent=S.c.length+" di "+ck.length;
 $("#c-list").innerHTML=ck.map(k=>`<li class="${S.c.includes(k)?"on":""}" title="${S.c.includes(k)?C[k][1].replace(/"/g,"&quot;"):"Ancora da scoprire"}">${S.c.includes(k)?C[k][0]:"???"}</li>`).join("");
 const tk=Object.keys(TR);$("#t-prog").textContent=S.t.length+" di "+tk.length;
 $("#t-list").innerHTML=tk.map(k=>`<li class="${S.t.includes(k)?"on":""}">${S.t.includes(k)?TR[k]:"???"}</li>`).join("");
 const ek=Object.keys(EN);$("#e-prog").textContent=S.e.length+" di "+ek.length;
 $("#e-list").innerHTML=ek.map(k=>`<li class="${S.e.includes(k)?"on":""}">${S.e.includes(k)?EN[k]:"???"}</li>`).join("");
 $("#b-back").disabled=!S.trail.length;
}
function renderParts(){
 const box=$("#parts");
 box.innerHTML=PARTS.map(p=>{
  const unlocked=p[0]==="p0"||S.visited.includes(p[0]);
  return `<button type="button" data-p="${p[0]}" ${unlocked?"":"disabled aria-disabled=\"true\" title=\"Raggiungi questa tappa seguendo la storia\""}>${p[1]}</button>`;
 }).join("");
 box.querySelectorAll("button:not(:disabled)").forEach(b=>b.addEventListener("click",()=>go(b.dataset.p)));
}
$("#b-back").addEventListener("click",()=>{if(S.trail.length){stop();S.node=S.trail.pop();render();save();window.scrollTo(0,0);}});
let armed=false;
$("#b-restart").addEventListener("click",function(){
 if(!armed){armed=true;this.textContent="Confermi? Concetti, trofei e finali restano";setTimeout(()=>{armed=false;this.textContent="Ricomincia";},3000);return;}
 armed=false;this.textContent="Ricomincia";go("p0",false);});
// Navigazione robusta: intercetta le scelte in fase capture, prima degli altri gestori.
window.__8761Navigate = function(id){
 if (!Object.prototype.hasOwnProperty.call(N,id)) {
  let note=document.getElementById("navigation-error");
  if(!note){note=document.createElement("p");note.id="navigation-error";note.setAttribute("role","alert");note.style.cssText="margin:12px 0;padding:12px;border:1px solid #e7a93e;border-radius:8px;color:#fff;background:#3b2412";$("#main").prepend(note);}
  note.textContent="Questa tappa non è disponibile ("+id+"). Torna al bivio precedente e scegli un'altra strada.";
  return false;
 }
 try { go(id); return true; }
 catch(err) {
  console.error("Errore durante l'apertura della tappa",id,err);
  let note=document.getElementById("navigation-error");
  if(!note){note=document.createElement("p");note.id="navigation-error";note.setAttribute("role","alert");note.style.cssText="margin:12px 0;padding:12px;border:1px solid #e7a93e;border-radius:8px;color:#fff;background:#3b2412";$("#main").prepend(note);}
  note.textContent="Si è verificato un errore nel caricamento di questa tappa. Torna indietro e riprova.";
  return false;
 }
};
$("#main").addEventListener("click",function(e){
 const target=e.target;
 const b=target && target.closest ? target.closest("button[data-go]") : null;
 if(!b || !this.contains(b)) return;
 e.preventDefault();
 const destination=b.getAttribute("data-go");
 window.__8761Navigate(destination);
});
render();
})();
</script>

</body></html>
