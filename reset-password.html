<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Il mio Atlante — Nuova password</title>
  <style>
    :root{--bg:#070b0c;--panel:#0d1315;--line:#2a3436;--text:#eee8dc;--gold:#c9a45d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 20%,#152022 0,#070b0c 45%,#050707 100%);color:var(--text);font-family:Georgia,serif;min-height:100vh}
    .wrap{max-width:620px;margin:9vh auto;padding:36px;background:rgba(10,15,16,.94);border:1px solid var(--line)}
    .eyebrow{font:12px monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
    h1{font-size:48px;font-weight:400;margin:14px 0}.intro{font-size:19px;line-height:1.5;color:#ccc8bf}
    label{display:block;font:12px monospace;letter-spacing:.12em;text-transform:uppercase;margin:24px 0 7px}
    input{width:100%;padding:14px;background:#111719;color:white;border:1px solid #364144;font-size:16px}
    button{width:100%;margin-top:24px;padding:14px;background:#211f17;color:white;border:1px solid var(--gold);cursor:pointer}
    #status{display:none;margin-top:20px;padding:13px;border:1px solid #394447;font:14px system-ui,sans-serif}
    #status.error{border-color:#87514b;color:#f1c8c1}
    #status.ok{border-color:#5b765e;color:#cfe2cf}
  </style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Atlante della Rete</div>
  <h1>Nuova password</h1>
  <p class="intro">Scegli una nuova password per il tuo account personale.</p>
  <label for="password">Nuova password</label>
  <input id="password" type="password" autocomplete="new-password" minlength="6">
  <label for="confirm">Ripeti password</label>
  <input id="confirm" type="password" autocomplete="new-password" minlength="6">
  <button id="save">SALVA LA NUOVA PASSWORD</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="assets/supabase-config.js"></script>
<script type="module">
  const cfg = window.ATLANTE_SUPABASE;
  const status = document.getElementById("status");
  const show = (m,k="ok") => { status.textContent=m; status.className=k; status.style.display="block"; };

  if (!cfg?.url || !cfg?.anonKey) {
    show("Configurazione Supabase mancante.", "error");
    throw new Error("ATLANTE_SUPABASE configuration missing");
  }

  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const sb = createClient(cfg.url, cfg.anonKey);

  document.getElementById("save").addEventListener("click", async () => {
    const p = document.getElementById("password").value;
    const c = document.getElementById("confirm").value;
    if (p.length < 6) return show("La password deve contenere almeno 6 caratteri.", "error");
    if (p !== c) return show("Le due password non coincidono.", "error");

    const { error } = await sb.auth.updateUser({ password: p });
    if (error) return show(error.message, "error");

    show("Password aggiornata. Ora puoi accedere al tuo Atlante.");
    setTimeout(() => location.href = "login.html", 1500);
  });
</script>
</body>
</html>
